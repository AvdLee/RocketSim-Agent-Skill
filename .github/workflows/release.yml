name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.2)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version input
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version '$VERSION'. Expected format like 1.0.2."
            exit 1
          fi

      - name: Fail if tag already exists
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Error: Tag $VERSION already exists. Refusing to re-release the same version."
            exit 1
          fi

      - name: Fail if version is not higher than latest release
        run: |
          set -euo pipefail

          latest_tag="$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            echo "No existing semver tags found. Proceeding with $VERSION."
            exit 0
          fi

          latest_version="$latest_tag"

          if [[ "$VERSION" == "$latest_version" ]]; then
            echo "Error: Version $VERSION equals latest released version $latest_version. Use a higher version."
            exit 1
          fi

          greatest="$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n 1)"
          if [[ "$greatest" != "$VERSION" ]]; then
            echo "Error: Version $VERSION must be higher than latest released version $latest_version."
            exit 1
          fi

      - name: Bump package versions
        run: |
          set -euo pipefail

          python3 <<'PY2'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]

          openai_path = pathlib.Path("agents/openai.yaml")
          openai_text = openai_path.read_text()
          updated_openai_text, count = re.subn(
              r'(?m)^version:\s*"[^"]+"$',
              f'version: "{version}"',
              openai_text,
              count=1,
          )
          if count != 1:
            raise SystemExit("Failed to update version in agents/openai.yaml")
          openai_path.write_text(updated_openai_text)

          json_paths = [
              pathlib.Path(".claude-plugin/plugin.json"),
              pathlib.Path(".claude-plugin/marketplace.json"),
              pathlib.Path(".cursor-plugin/plugin.json"),
          ]

          for path in json_paths:
            data = json.loads(path.read_text())
            data["version"] = version
            if path.name == "marketplace.json":
              if not data.get("plugins"):
                raise SystemExit("Expected at least one plugin in .claude-plugin/marketplace.json")
              data["plugins"][0]["version"] = version
            path.write_text(json.dumps(data, indent=2) + "\n")
          PY2

      - name: Validate packaged metadata
        run: |
          set -euo pipefail

          python3 <<'PY2'
          import json
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          repository = "https://github.com/AvdLee/RocketSim-Agent-Skill"

          openai_path = pathlib.Path("agents/openai.yaml")
          openai_text = openai_path.read_text()

          version_match = re.search(r'(?m)^version:\s*"([^"]+)"$', openai_text)
          repository_match = re.search(r'(?m)^repository:\s*(.+)$', openai_text)

          if not version_match or version_match.group(1) != version:
            raise SystemExit("agents/openai.yaml version is out of sync")

          if not repository_match or repository_match.group(1).strip() != repository:
            raise SystemExit("agents/openai.yaml repository is out of sync")

          required_terms = ["RocketSim", "Simulator"]
          for term in required_terms:
            if term not in openai_text:
              raise SystemExit(f"agents/openai.yaml description must mention {term}")

          expected_json = {
              pathlib.Path(".claude-plugin/plugin.json"): {
                  "skills": ["./Agent-Skill"],
                  "repository": repository,
              },
              pathlib.Path(".claude-plugin/marketplace.json"): {
                  "name": "rocketsim-agent-skill",
                  "repository": repository,
              },
              pathlib.Path(".cursor-plugin/plugin.json"): {
                  "skills": ["Agent-Skill"],
                  "repository": repository,
              },
          }

          for path, expectations in expected_json.items():
            data = json.loads(path.read_text())

            if data.get("version") != version:
              raise SystemExit(f"{path} version is out of sync")

            if path.name == "marketplace.json":
              if data.get("name") != expectations["name"]:
                raise SystemExit("Marketplace package name changed unexpectedly")
              if not data.get("plugins"):
                raise SystemExit("Marketplace file must contain at least one plugin")
              plugin = data["plugins"][0]
              if plugin.get("version") != version:
                raise SystemExit("Marketplace plugin version is out of sync")
              if plugin.get("repository") != expectations["repository"]:
                raise SystemExit("Marketplace plugin repository is out of sync")
              if "RocketSim" not in data.get("metadata", {}).get("description", ""):
                raise SystemExit("Marketplace metadata description must mention RocketSim")
            else:
              if data.get("repository") != expectations["repository"]:
                raise SystemExit(f"{path} repository is out of sync")
              if data.get("skills") != expectations["skills"]:
                raise SystemExit(f"{path} skills path changed unexpectedly")
              if "RocketSim" not in data.get("description", ""):
                raise SystemExit(f"{path} description must mention RocketSim")
          PY2

      - name: Commit and push version bump
        run: |
          set -euo pipefail

          if git diff --quiet agents/openai.yaml .claude-plugin/plugin.json .claude-plugin/marketplace.json .cursor-plugin/plugin.json; then
            echo "Error: No changes detected after version bump. Is the repo already at version $VERSION?"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agents/openai.yaml .claude-plugin/plugin.json .claude-plugin/marketplace.json .cursor-plugin/plugin.json
          git commit -m "Bump version to $VERSION"
          git push

      - name: Create tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
